name: CPU reproduction and improvement checks

on:
  push:
    branches: [main, improvement]
  workflow_dispatch:

jobs:
  offline-checks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install submission dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify dependencies
        run: python -m pip check
      - name: Check reproduction without API
        run: python baseline/test_reproduction.py
      - name: Check improvement with saved responses
        run: python baseline/test_improved_search.py
